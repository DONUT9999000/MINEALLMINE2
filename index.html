<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Code lyric video</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --dusk-top:#0b0e2b; --dusk-bottom:#2a1f55;
  --amber:#ffe3a3; --pink:#ffb3c7; --sky:#a9d8ff; --lav:#8f93c9; --ink:#fffaf0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:#0b0e2b;overflow:hidden}
body{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
#stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(170deg,var(--dusk-top),var(--dusk-bottom))}
.layer{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.bokeh{position:absolute;border-radius:50%}
.glyph{position:absolute;white-space:nowrap;color:var(--lav)}
.line{position:absolute;transform:translate(-50%,-50%);font-size:44px;line-height:1.35;white-space:pre;
  text-shadow:0 0 26px rgba(255,227,163,.4);transition:opacity .9s;opacity:1}
.line.past{opacity:.2}
.row{display:block;opacity:0;transform:translateX(-26px);filter:blur(6px);
  transition:opacity .5s,transform .5s,filter .5s;transition-delay:calc(var(--i)*.14s)}
.line.on .row,.line.past .row{opacity:1;transform:none;filter:none}
.f{color:var(--amber)} .s{color:var(--pink)} .k{color:var(--sky)} .p{color:var(--lav)} .c{color:var(--lav);opacity:.7;font-style:italic}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(10,6,24,.65) 100%)}
#grain{position:absolute;inset:-50%;pointer-events:none;opacity:.14;mix-blend-mode:overlay;animation:grain .6s steps(4) infinite;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(0,0)}}
#hud{position:absolute;left:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center;font-size:14px;pointer-events:none}
#dot{width:10px;height:10px;border-radius:50%;background:#ff4d5e;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(8,10,30,.5);text-align:center;padding:24px;z-index:5}
#overlay h1{font-size:22px;margin:0 0 4px;font-weight:700}
#overlay p{margin:0 0 8px;font-size:14px;color:var(--lav);max-width:34ch;line-height:1.5}
button{font:inherit;color:#0b0e2b;background:var(--amber);border:0;cursor:pointer}
.big{width:132px;height:132px;border-radius:50%;font-size:52px;padding:0 0 0 10px;box-shadow:0 0 60px 12px rgba(255,227,163,.35)}
button:focus-visible{outline:2px solid var(--sky);outline-offset:4px}
.moon,.earth{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
.moon{background:radial-gradient(circle at 62% 30%,rgba(160,150,110,.35) 0 7%,transparent 8%),radial-gradient(circle at 30% 62%,rgba(160,150,110,.3) 0 10%,transparent 11%),radial-gradient(circle at 70% 70%,rgba(160,150,110,.28) 0 6%,transparent 7%),radial-gradient(circle at 35% 35%,#fffdf2,#f1e7bd 60%,#cbbf90);box-shadow:0 0 90px 30px rgba(255,240,190,.35)}
.earth{background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.3),transparent 40%),radial-gradient(circle at 40% 45%,#4f9d5b 0 14%,transparent 15%),radial-gradient(circle at 65% 62%,#4f9d5b 0 11%,transparent 12%),radial-gradient(circle at 55% 25%,#5aa862 0 8%,transparent 9%),radial-gradient(circle at 35% 35%,#4aa3df,#1d5fa8 65%,#0e2f66);box-shadow:inset -30px -30px 60px rgba(0,0,20,.6),0 0 70px 14px rgba(120,190,255,.3)}
#tent{position:absolute;inset:0;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% -15%,rgba(150,50,80,.32) 0 7deg,rgba(255,235,210,.05) 7deg 14deg);-webkit-mask-image:linear-gradient(to bottom,#000,transparent 60%);mask-image:linear-gradient(to bottom,#000,transparent 60%)}
#msg{font-size:13px;color:var(--pink);min-height:1.2em}
@media (prefers-reduced-motion:reduce){#grain,#dot{animation:none}}

/* ===== SPACE BACKGROUND (added) ===== */
#stage{background:
  radial-gradient(ellipse at 20% 25%,rgba(255,120,190,.16),transparent 55%),
  radial-gradient(ellipse at 80% 70%,rgba(110,140,255,.16),transparent 55%),
  radial-gradient(ellipse at 55% 45%,rgba(160,90,255,.10),transparent 60%),
  linear-gradient(170deg,#03040f,#0a0720 55%,#120a2e)}
#stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;border-radius:50%;background:var(--c);box-shadow:0 0 var(--g) var(--c);
  opacity:.25;animation:twinkle var(--d) ease-in-out infinite;animation-delay:var(--w)}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.star{animation:none;opacity:.7}}
/* ===== RESPONSIVE (added) ===== */
.line{white-space:pre-wrap;width:max-content;text-align:left;overflow-wrap:break-word}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
#overlay h1{font-size:clamp(18px,5vw,28px)}
#hud{font-size:clamp(12px,3vw,14px)}
</style>
</head>
<body>
<div id="stage">
  <div id="stars"></div>
  <div class="layer" id="far"></div>
  <div class="layer" id="mid"></div>
  <div class="layer" id="world"></div>
  <div id="tent"></div>
  <div id="grain"></div>
  <div id="vignette"></div>
  <div id="hud"><span id="dot"></span><span id="tc">00:00</span></div>
  <div id="overlay">
    <h1 id="ttl">My Love Mine All Mine</h1>
    <button id="play" class="big" aria-label="Play">▶</button>
    <div id="msg"></div>
  </div>
</div>
<audio id="aud" preload="auto"></audio>

<script>
/* ====== EDIT HERE ======
   AUDIO_SRC = your mp3 (put it in the same folder as this file)
   at = second the line appears   x,y = where it sits in the "world"
   z = camera zoom   r = camera tilt (degrees)
   code = the lyric written as code (
 = new row). Colors are automatic.
   Each row is one lyric line, in song order. Swap the code: text for your own version.
   The at: times are already set from your timings. */
const AUDIO_SRC = 'song.mp3';
/* PASTE YOUR CODE LYRICS between the backticks below.
   Keep a blank line between each lyric line (that is what splits them).
   Line 1 here goes with row 01, line 2 with row 02, and so on (22 total). */
const LYRICS_CODE = `
moon.reflects("Moon, a hole of light");

it.shines("Through the big top tent up high");

here.exists({ before: "Here, before and after me" });

it.shines("Shinin' down on me");

moon.tell({ me: "Moon, tell me if I could" });

my.heart.send({ up: "Send up my heart to you?" });

when.life.ends({ truth: "So, when I die, which I must do" });

could.you.shine({ "down here": "Could it shine down here with you?" });

it.makes("'Cause my love is mine, all mine");

i.love({ mine: "I love, mine, mine, mine" });

nothing.belongs({ "in the world": "Nothing in the world belongs to me" });

but.my_love.remains("But my love, mine, all mine, all mine");

earth.holds({ "my baby": "My baby here on Earth" });

she.showed({ "my heart": "Showed me what my heart was worth" });

when.my_turn_arrives("So, when it comes to be my turn");

moon.shine({ "for her": "Could you shine it down here for her?" });

it.makes("'Cause my love is mine, all mine");

i.love({ mine: "I love, mine, mine, mine" });

nothing.belongs({ "in the world": "Nothing in the world belongs to me" });

but.my_love.remains("But my love, mine, all mine");

nothing.is_mine({ "for free": "Nothing in the world is mine for free" });

but.my_love.remains("But my love, mine, all mine, all mine");
`;

const SONG = [
  /* 01  0:09.17  verse 1 */ { at: 9.17, x: 0, y: 0, z: 1.0, r: -1.5, code: 'line_01.goes("in_here")' },
  /* 02  0:12.87  verse 1 */ { at: 12.87, x: 1100, y: -250, z: 1.1, r: 1.2, code: 'line_02.goes("in_here")' },
  /* 03  0:17.15  verse 1 */ { at: 17.15, x: 2200, y: 200, z: 0.95, r: -0.8, code: 'line_03.goes("in_here")' },
  /* 04  0:21.17  verse 1 */ { at: 21.17, x: 3300, y: -100, z: 1.2, r: 1.5, code: 'line_04.goes("in_here")' },
  /* 05  0:26.20  verse 1 */ { at: 26.2, x: 4400, y: 150, z: 1.0, r: -1.2, code: 'line_05.goes("in_here")' },
  /* 06  0:29.74  verse 1 */ { at: 29.74, x: 5500, y: -300, z: 1.15, r: 1.0, code: 'line_06.goes("in_here")' },
  /* 07  0:33.83  verse 1 */ { at: 33.83, x: 6600, y: 100, z: 0.9, r: -1.6, code: 'line_07.goes("in_here")' },
  /* 08  0:37.46  verse 1 */ { at: 37.46, x: 7700, y: -200, z: 1.2, r: 1.3, code: 'line_08.goes("in_here")' },
  /* 09  0:42.04  chorus */ { at: 42.04, x: 8800, y: 250, z: 1.05, r: -0.7, code: 'line_09.goes("in_here")' },
  /* 10  0:46.39  chorus */ { at: 46.39, x: 9900, y: -150, z: 1.15, r: 1.4, code: 'line_10.goes("in_here")' },
  /* 11  0:50.73  chorus */ { at: 50.73, x: 11000, y: 180, z: 0.95, r: -1.1, code: 'line_11.goes("in_here")' },
  /* 12  0:54.53  chorus */ { at: 54.53, x: 12100, y: -250, z: 1.25, r: 0.9, code: 'line_12.goes("in_here")' },
  /* 13  1:18.73  verse 2 */ { at: 78.73, x: 13200, y: 100, z: 1.0, r: -1.4, code: 'line_13.goes("in_here")' },
  /* 14  1:22.35  verse 2 */ { at: 82.35, x: 14300, y: -200, z: 1.1, r: 1.2, code: 'line_14.goes("in_here")' },
  /* 15  1:26.38  verse 2 */ { at: 86.38, x: 15400, y: 220, z: 0.9, r: -0.9, code: 'line_15.goes("in_here")' },
  /* 16  1:30.14  verse 2 */ { at: 90.14, x: 16500, y: -120, z: 1.2, r: 1.6, code: 'line_16.goes("in_here")' },
  /* 17  1:34.45  chorus 2 */ { at: 94.45, x: 17600, y: 160, z: 1.05, r: -1.0, code: 'line_17.goes("in_here")' },
  /* 18  1:39.06  chorus 2 */ { at: 99.06, x: 18700, y: -260, z: 1.15, r: 1.1, code: 'line_18.goes("in_here")' },
  /* 19  1:43.36  chorus 2 */ { at: 103.36, x: 19800, y: 120, z: 0.95, r: -1.5, code: 'line_19.goes("in_here")' },
  /* 20  1:47.22  chorus 2 */ { at: 107.22, x: 20900, y: -180, z: 1.2, r: 1.3, code: 'line_20.goes("in_here")' },
  /* 21  1:51.90  chorus 2 */ { at: 111.9, x: 22000, y: 240, z: 1.0, r: -0.8, code: 'line_21.goes("in_here")' },
  /* 22  1:55.57  chorus 2 */ { at: 115.57, x: 23100, y: -100, z: 1.1, r: 1.0, code: 'line_22.goes("in_here")' }
];
{ const parts = LYRICS_CODE.trim().split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  parts.forEach((c,i)=>{ if(SONG[i]) SONG[i].code = c; }); }
const DECOR = [ // line = which row (0 = first) the picture sits beside
  { cls: 'moon',  line: 0,  dx: 430,  dy: -330, size: 300 },
  { cls: 'moon',  line: 4,  dx: -450, dy: -320, size: 240 },
  { cls: 'earth', line: 12, dx: 470,  dy: 300,  size: 280 },
  { cls: 'earth', line: 18, dx: -470, dy: -300, size: 220 }
];
const TRAVEL = 1.2;   // seconds the camera takes to swing to the next line
const END_PAD = 8;    // seconds after the last line before the end screen

/* ====== engine ====== */
const $ = id => document.getElementById(id);
const stage = $('stage'), world = $('world'), far = $('far'), mid = $('mid');
const aud = $('aud'), overlay = $('overlay'), msg = $('msg');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const RX = /(\/\/.*)|("[^"]*")|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)(?=\s*:)|([{}()\[\];,.:=])/g;
const hl = s => esc(s).replace(RX,(m,c,str,fn,key,p)=>
  c?`<span class="c">${c}</span>`: str?`<span class="s">${str}</span>`:
  fn?`<span class="f">${fn}</span>`: key?`<span class="k">${key}</span>`: `<span class="p">${p}</span>`);

DECOR.forEach(d=>{const l=SONG[d.line]; if(!l) return; const e=document.createElement('div');
  e.className=d.cls; Object.assign(e.style,{left:(l.x+d.dx)+'px',top:(l.y+d.dy)+'px',width:d.size+'px',height:d.size+'px'}); world.appendChild(e);});
const lineEls = SONG.map(l=>{
  const d = document.createElement('div');
  d.className='line'; d.style.left=l.x+'px'; d.style.top=l.y+'px';
  d.innerHTML = l.code.split('\n').map((r,i)=>`<span class="row" style="--i:${i}">${hl(r)||'&nbsp;'}</span>`).join('');
  d.style.opacity=0; world.appendChild(d); return d;
});

/* background built to cover wherever the lines are */
let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const xs=SONG.map(l=>l.x), ys=SONG.map(l=>l.y), PAD=1400;
function fill(layer,k,count,make){
  const x0=Math.min(...xs)*k-PAD, x1=Math.max(...xs)*k+PAD, y0=Math.min(...ys)*k-PAD, y1=Math.max(...ys)*k+PAD;
  for(let i=0,n=Math.round(count*Math.max(1,(x1-x0)/3500));i<n;i++) layer.appendChild(make(x0+rnd()*(x1-x0), y0+rnd()*(y1-y0)));
}
const cols=['255,227,163','255,179,199','169,216,255','190,170,255'];
fill(far,.25,34,(x,y)=>{const e=document.createElement('div');e.className='bokeh';
  const s=90+rnd()*220,c=cols[Math.floor(rnd()*4)];
  Object.assign(e.style,{left:x+'px',top:y+'px',width:s+'px',height:s+'px',
    background:`radial-gradient(circle,rgba(${c},${.22+rnd()*.25}) 0%,rgba(${c},0) 70%)`});return e;});
const G=['{ }','=>','();','</>','[ ]','0x','&&','::','//','fn'];
fill(mid,.55,70,(x,y)=>{const e=document.createElement('div');e.className='glyph';
  e.textContent=G[Math.floor(rnd()*G.length)];
  Object.assign(e.style,{left:x+'px',top:y+'px',fontSize:(20+rnd()*34)+'px',opacity:.07+rnd()*.1});return e;});

/* camera */
const first=SONG[0];
const START={x:first.x-700,y:first.y+120,z:first.z*.9,r:first.r-3};
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,p)=>a+(b-a)*p;
function camAt(t){
  let i=-1; SONG.forEach((l,n)=>{ if(t>=l.at-TRAVEL) i=n; });
  if(i<0) return START;
  const from=i===0?START:SONG[i-1], to=SONG[i];
  const p=ease(clamp((t-(to.at-TRAVEL))/TRAVEL));
  return {x:lerp(from.x,to.x,p),y:lerp(from.y,to.y,p),z:lerp(from.ez||from.z,to.ez||to.z,p),r:lerp(from.r,to.r,p)};
}
function place(el,c,k,t,shake){
  const W=stage.clientWidth,H=stage.clientHeight,fit=1;
  const sx=shake?Math.sin(t*1.3)*6+Math.sin(t*2.9)*3:0, sy=shake?Math.sin(t*1.7+1)*5+Math.sin(t*3.3)*2:0,
        sr=shake?Math.sin(t*.9)*.35:0;
  el.style.transform=`translate(${W/2+sx*k}px,${H/2+sy*k}px) rotate(${(c.r+sr)*(k===1?1:k)}deg) scale(${Math.pow(c.z*fit,k===1?1:k)}) translate(${-c.x*k}px,${-c.y*k}px)`;
}

/* clock: song if one is loaded, otherwise a plain timer */
let hasSong=false, useAudio=false, t0=0, running=false;
const now=()=>useAudio?aud.currentTime:(performance.now()-t0)/1000;
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
const endAt=SONG[SONG.length-1].at+END_PAD;

function frame(){
  if(!running) return;
  const t=now(), c=camAt(t);
  place(world,c,1,t,!reduce); place(mid,c,.55,t,!reduce); place(far,c,.25,t,!reduce);
  SONG.forEach((l,i)=>{
    const el=lineEls[i], next=SONG[i+1];
    const on=t>=l.at, past=next&&t>=next.at;
    el.style.opacity=''; el.classList.toggle('on',on&&!past); el.classList.toggle('past',!!past);
  });
  $('tc').textContent=fmt(t);
  if(t>endAt){ finish(); return; }
  requestAnimationFrame(frame);
}
function start(){
  lineEls.forEach(e=>{e.className='line';e.style.opacity=0;});
  running=true; useAudio=false; t0=performance.now(); msg.textContent='';
  if(hasSong){
    aud.currentTime=0;
    aud.play().then(()=>{useAudio=true;}).catch(()=>{msg.textContent='Couldn’t play that file here, using the timer instead.';});
  }
  overlay.style.display='none'; requestAnimationFrame(frame);
}
function finish(){
  running=false; aud.pause();
  $('ttl').textContent='That’s a wrap'; $('play').textContent='↺'; overlay.style.display='flex';
}
$('play').onclick=start;
aud.src=AUDIO_SRC; hasSong=true;
aud.onerror=()=>{hasSong=false;};

/* responsive layout: wrap long lines and zoom so every line fits the screen (phone, iPad, desktop) */
function layout(){
  const W=stage.clientWidth||innerWidth;
  const wrapW=clamp(W*.92/.5,700,1500);
  lineEls.forEach(e=>{e.style.maxWidth=wrapW+'px';});
  SONG.forEach((l,i)=>{ const w=lineEls[i].offsetWidth||wrapW; l.ez=Math.min(l.z,W*.92/w); });
  START.z=(SONG[0].ez||SONG[0].z)*.9;
}
layout();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{layout(); if(!running){place(world,START,1,0,false);place(mid,START,.55,0,false);place(far,START,.25,0,false);}});

/* first frame preview behind the start screen */
(function(){const c=START;place(world,c,1,0,false);place(mid,c,.55,0,false);place(far,c,.25,0,false);})();
addEventListener('resize',()=>{ layout(); if(!running){place(world,START,1,0,false);place(mid,START,.55,0,false);place(far,START,.25,0,false);} });
</script>
<script>
/* ===== SPACE STARS (added) ===== */
(function(){
  const box=document.getElementById('stars');
  const colors=['#ffffff','#ffffff','#ffffff','#ffffff','#fff4ff','#ff9ec7','#ff7fb8','#a9d8ff','#c3b0ff','#9ff0ff'];
  for(let i=0;i<190;i++){
    const s=document.createElement('div'); s.className='star';
    const size=Math.random()<.12?3:(Math.random()<.4?2:1.2);
    const c=colors[Math.floor(Math.random()*colors.length)];
    s.style.cssText='left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;width:'+size+'px;height:'+size+'px;'
      +'--c:'+c+';--g:'+(size*3)+'px;--d:'+(2+Math.random()*4)+'s;--w:-'+(Math.random()*6)+'s';
    box.appendChild(s);
  }
})();
</script>
</body>
</html>
